# release.gitlab-ci.yml
# Unified GitLab CI template to handle version tagging + release archive creation.
# Uses standard-version for semver bumping and creates a zip from the tag using git archive.
# Required CI/CD variables:
#   - CI_PUSH_TOKEN
# Optional:
#   - CI_BOT_EMAIL
#   - CI_BOT_NAME
#   - ZIP_PREFIX (default: "release")

stages:
- release

# -------------------------------
# Template: bump version + tag + zip
# -------------------------------
.release-template:
  stage: release
  image: node:20

  # Default variable for the ZIP prefix (can be overridden)
  variables:
    ZIP_PREFIX: "release"

  script:
  # 1) Install deps & Git config
  - npm install
  - git config --global user.email "${CI_BOT_EMAIL:-ci@example.com}"
  - git config --global user.name "${CI_BOT_NAME:-CI Bot}"
  - git fetch --tags

  # 2) Bump version + create tag & changelog
  - 'npx standard-version --message "chore(release): %s"'

  # 3) Compute VERSION/TAG, build zip, push commit and tags
  - |
    VERSION=$(node -p "require('./package.json').version")
    TAG="v${VERSION}"
    ZIP_NAME="${ZIP_PREFIX}-${TAG}.zip"
    git archive --format=zip --output "$ZIP_NAME" "$TAG"

    # Set remote with CI token and push commit + tags
    git remote set-url origin "https://gitlab-ci-token:${CI_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    git push origin "HEAD:${CI_COMMIT_REF_NAME}"
    git push origin --tags

    # Export variables for downstream jobs (dotenv)
    echo "VERSION=${VERSION}" > tag.env
    echo "TAG=${TAG}" >> tag.env
    echo "ZIP_NAME=${ZIP_NAME}" >> tag.env

  artifacts:
    name: "release-$CI_COMMIT_REF_NAME"
    paths:
    - release-v*.zip
    reports:
      dotenv: tag.env

  rules:
  # Never run on tag pipelines
  - if: '$CI_COMMIT_TAG'
    when: never

  # Only run on main branch, excluding chore(release) commits
  - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE !~ /^chore\(release\):/'
    when: on_success

  # Prevent running in all other cases
  - when: never

# -------------------------------
# Template: GitLab Release from tag (same pipeline)
# -------------------------------
.gitlab-release-template:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: release

  needs:
  - job: release # <- le job concret qui produit TAG + artefacts
    artifacts: true

  script:
  - echo "Creating GitLab release with release-cli for tag $TAG"
  - ls -la

  release:
    tag_name: "$TAG"
    name: "Release $TAG"
    description: "$CI_COMMIT_MESSAGE"
    assets:
      links:
      - name: "Source Archive"
        url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/download"

  rules:
  - if: '$CI_COMMIT_TAG'
    when: never
  - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    when: on_success

# -------------------------------
# Jobs
# -------------------------------
release:
  extends: .release-template

gitlab_release:
  extends: .gitlab-release-template
