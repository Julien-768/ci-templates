# release.gitlab-ci.yml
#
# Unified GitLab CI *template* for handling version bumping, tagging,
# release archive creation, and GitLab Release publication.
#
# IMPORTANT:
# - This file only defines *hidden template jobs* (prefixed with a dot).
# - These templates MUST be instantiated by concrete jobs
#   in the consuming project pipeline.
# - No global `stages:` definition is provided to avoid interfering
#   with project-level pipeline stage ordering.
#
# Required CI/CD variables:
#   - CI_PUSH_TOKEN
#
# Optional variables:
#   - CI_BOT_EMAIL
#   - CI_BOT_NAME
#   - ZIP_PREFIX (default: "release")

# --------------------------------------------------
# Template: version bump + tag creation + zip archive
# --------------------------------------------------
.release-template:
  stage: release
  image: node:20

  # Default variables (can be overridden by the project)
  variables:
    ZIP_PREFIX: "release"

  script:
    # 1) Install dependencies and configure Git identity
    - npm install
    - git config --global user.email "${CI_BOT_EMAIL:-ci@example.com}"
    - git config --global user.name "${CI_BOT_NAME:-CI Bot}"
    - git fetch --tags

    # 2) Bump version, generate changelog and create Git tag
    #    Uses conventional commits via standard-version
    - 'npx standard-version --message "chore(release): %s"'

    # 3) Compute version/tag, create release archive and push changes
    - |
      VERSION=$(node -p "require('./package.json').version")
      TAG="v${VERSION}"
      ZIP_NAME="${ZIP_PREFIX}-${TAG}.zip"

      # Create release archive from the Git tag
      git archive --format=zip --output "$ZIP_NAME" "$TAG"

      # Push commit and tags using CI token
      git remote set-url origin "https://gitlab-ci-token:${CI_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git push origin "HEAD:${CI_COMMIT_REF_NAME}"
      git push origin --tags

      # Export variables for downstream jobs
      echo "VERSION=${VERSION}" > tag.env
      echo "TAG=${TAG}" >> tag.env
      echo "ZIP_NAME=${ZIP_NAME}" >> tag.env

  artifacts:
    name: "release-$CI_COMMIT_REF_NAME"
    paths:
      - release-v*.zip
    reports:
      dotenv: tag.env

  rules:
    # Never run on tag pipelines
    - if: '$CI_COMMIT_TAG'
      when: never

    # Run only on main branch, on push, excluding release commits
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE !~ /^chore\(release\):/'
      when: on_success

    # Disable in all other cases
    - when: never

# --------------------------------------------------
# Template: GitLab Release publication
#
# This job consumes artifacts and variables produced
# by the concrete `release` job instantiated in the project.
# --------------------------------------------------
.gitlab-release-template:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: release

  # The consuming project MUST define a concrete `release` job
  # extending `.release-template`
  needs:
    - job: release
      artifacts: true

  script:
    - echo "Creating GitLab release for tag $TAG"
    - ls -la

  release:
    tag_name: "$TAG"
    name: "Release $TAG"
    description: "$CI_COMMIT_MESSAGE"
    assets:
      links:
        - name: "Source Archive"
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/download"

  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success

