# release.gitlab-ci.yml
# Unified GitLab CI template to handle version tagging + release archive creation.
# Uses standard-version for semver bumping and creates a zip from the tag using git archive.
# Required CI/CD variables:
#   - CI_PUSH_TOKEN
# Optional:
#   - CI_BOT_EMAIL
#   - CI_BOT_NAME
#   - ZIP_PREFIX (default: "release")

# -------------------------------
# Template: bump version + tag + zip
# -------------------------------
.release-template:
  stage: release
  image: node:20

  # Default variable for the ZIP prefix (can be overridden)
  variables:
    ZIP_PREFIX: "release"

  script:
    # 1) Install dependencies and configure Git
    - npm install
    - git config --global user.email "${CI_BOT_EMAIL:-ci@example.com}"
    - git config --global user.name "${CI_BOT_NAME:-CI Bot}"
    - git fetch --tags

    # 2. Use standard-version to bump semver and create tag and changelog
    - 'npx standard-version --message "chore(release): %s"'

    # 3. Archive source code at the tag into a zip, push commit and tags
    - bash -c '
        VERSION=$(node -p "require(\"./package.json\").version");
        TAG="v${VERSION}";
        ZIP_NAME="${ZIP_PREFIX}-${TAG}.zip";
        git archive --format=zip --output "$ZIP_NAME" "$TAG";
        git remote set-url origin https://gitlab-ci-token:${CI_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git;
        git push origin HEAD:$CI_COMMIT_REF_NAME;
        git push origin --tags
      '

  # Expose the zip as CI artifact (downloadable in GitLab)
  artifacts:
    name: "release-$CI_COMMIT_REF_NAME"
    paths:
      - release-v*.zip

  # Run only if pushing to main (not on tag pipelines)
  # rules:
  #   - if: '$CI_COMMIT_TAG'  # skip if pipeline is for tag
  #     when: never
  #   - if: '$CI_COMMIT_BRANCH =~ /^main$|^ci-cd$/ && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE !~ /^chore\(release\):/'
  #     when: on_success

  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^main$|^ci-cd$/ && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE !~ /^chore\(release\):/'
      when: on_success

# -------------------------------
# Template: GitLab Release from tag
# -------------------------------
.gitlab-release-template:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: release

  # Minimal script for release-cli, content handled by `release:` keyword
  script:
    - echo "Creating GitLab release with release-cli"

  # GitLab release definition
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Release $CI_COMMIT_TAG"
    description: $CI_COMMIT_MESSAGE
    assets:
      links:
        - name: "Source Archive"
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/download"

  # Run only on tags
  rules:
    - if: $CI_COMMIT_TAG

