# eslint-prettier.gitlab-ci.yml
#
# Shared GitLab CI template for formatting and linting non-Python files using
# Prettier and ESLint.
#
# This job is intended to enforce consistent code style across the repository.
# It runs:
# - `prettier --check` to validate formatting
# - `eslint` to validate lint rules (with warnings treated as errors)
#
# Notes:
# - This job installs tooling on the fly to stay aligned with the latest versions.
#   If you prefer pinning versions, lock them in package.json instead.
# - For best developer experience, install the same tooling locally (via npm + pre-commit).
#

.format-lint-template:
  stage: lint
  image: node:20-alpine

  variables:
    # Fail fast on errors
    ESLINT_NO_DEV_ERRORS: "true"
    PRETTIER_CI: "true"

  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

  before_script:
    - npm config set fund false
    - npm config set audit false

  script:
    # Install CLI tools (global) used by the job
    - npm install -g prettier@latest prettier-plugin-svelte@latest eslint@latest

    # Install ESLint dependencies (local) used by the repository config
    - npm install --save-dev --no-progress eslint-config-prettier@latest eslint-plugin-jest@^28.14.0 eslint-plugin-svelte3@latest eslint-plugin-prettier@latest @gitlab/eslint-plugin@latest

    # Run checks and propagate a single exit code
    - |
      exit_code=0

      prettier --check --log-level=warn . || exit_code=$?
      eslint --max-warnings=0 . || exit_code=$?

      if [ "$exit_code" -ne 0 ]; then
        echo "❌ Formatting and/or linting issues detected."
        echo "Please ensure all non-Python files adhere to the project's code style guidelines."
        echo "Refer to the project README for instructions on installing pre-commit hooks locally."
      fi

      exit "$exit_code"

Format & lint:
  extends: .format-lint-template
