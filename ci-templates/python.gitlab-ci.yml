# python.gitlab-ci.yml

isort:
  stage: lint
  image: python:latest
  before_script:
    - pip install isort
  script:
    - isort . --check-only

black:
  stage: lint
  image: python:latest
  before_script:
    - pip install black
    - pip install black[jupyter]
  script:
    - black --check .

flake8:
  stage: lint
  image: python:latest
  script:
    - pip install flake8
    - pip install flake8-pyproject
    - flake8 .

pylint:
  stage: lint
  image: python:latest
  before_script:
    - pip install pylint
  script:
    - ls
    - find . -type f -name "*.py" | xargs pylint --rcfile=pyproject.toml
