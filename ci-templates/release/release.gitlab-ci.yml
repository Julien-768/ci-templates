# release.gitlab-ci.yml
#
# Shared GitLab CI template implementing a complete release workflow:
# version bumping, changelog generation, Git tagging, release archive
# creation and (optional) GitLab Release publication.
#
# Variables used by this template:
#
# - CI_PUSH_TOKEN (recommended):
#   Token with permission to push commits and tags to the repository.
#   If not set, the `release` job runs in "dry-run" mode (no push).
#
# - CI_BOT_EMAIL (optional):
#   Email address used for Git commits created during the release process.
#   Default: "ci@example.com"
#
# - CI_BOT_NAME (optional):
#   Git author name used for release commits.
#   Default: "CI Bot"
#
# - ZIP_PREFIX (optional):
#   Prefix used when generating the release archive filename.
#   Default: "release"

# --------------------------------------------------
# Hidden template: version bump + tag creation + zip
# --------------------------------------------------
.release-template:
  stage: release
  image: node:20

  variables:
    ZIP_PREFIX: "release"

  script:
    - |
      set -e

      # 1) Install dependencies and configure Git identity
      npm install
      git config --global user.email "${CI_BOT_EMAIL:-ci@example.com}"
      git config --global user.name "${CI_BOT_NAME:-CI Bot}"
      git fetch --tags

      # 2) Bump version, generate changelog and create Git tag
      npx standard-version --message "chore(release): %s"

      # 3) Compute tag from git (robust) and create release archive
      TAG="$(git describe --tags --abbrev=0)"
      VERSION="${TAG#v}"
      ZIP_NAME="${ZIP_PREFIX}-${TAG}.zip"

      echo "Creating archive for ${TAG} -> ${ZIP_NAME}"
      git archive --format=zip --output "$ZIP_NAME" "$TAG"

      # Export variables for downstream jobs
      echo "VERSION=${VERSION}" > tag.env
      echo "TAG=${TAG}" >> tag.env
      echo "ZIP_NAME=${ZIP_NAME}" >> tag.env

      # 4) Push changes and tags (if token is available)
      if [ -z "${CI_PUSH_TOKEN:-}" ]; then
        echo "⚠️ No CI_PUSH_TOKEN provided."
        echo "Dry-run mode: commit/tag/archive generated locally, but push is skipped."
        exit 0
      fi

      git remote set-url origin "https://gitlab-ci-token:${CI_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git push origin "HEAD:${CI_COMMIT_REF_NAME}"
      git push origin --tags

  artifacts:
    name: "release-$CI_COMMIT_REF_NAME"
    paths:
      - "*.zip"
    reports:
      dotenv: tag.env

  rules:
    - if: '$CI_COMMIT_TAG'
      when: never

    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE !~ /^chore\(release\):/'
      when: on_success

    - when: never

# --------------------------------------------------
# Hidden template: GitLab Release publication (best-effort)
# --------------------------------------------------
.gitlab-release-template:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest

  needs:
    - job: release
      artifacts: true

  script:
    - |
      set -e

      if [ -z "${TAG:-}" ]; then
        echo "No TAG provided (dry-run mode). Skipping GitLab Release publication."
        exit 0
      fi

      echo "Creating GitLab release for tag $TAG (best-effort)"
      ls -la

      ASSET_URL="$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_REF_NAME/download?job=release"

      release-cli create \
        --tag-name "$TAG" \
        --name "Release $TAG" \
        --description "$(printf '%s\n\nSource archive: %s\n' "$CI_COMMIT_MESSAGE" "$ASSET_URL")" \
      || {
        echo "⚠️ GitLab release creation failed (ignored)."
        exit 0
      }

  rules:
    - if: '$CI_COMMIT_TAG'
      when: never

    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE !~ /^chore\(release\):/'
      when: on_success

    - when: never

# --------------------------------------------------
# Concrete jobs
# --------------------------------------------------
release:
  extends: .release-template

gitlab_release:
  extends: .gitlab-release-template
  allow_failure: true
