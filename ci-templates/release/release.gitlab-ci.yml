# release.gitlab-ci.yml
#
# Shared GitLab CI template implementing a complete release workflow:
# version bumping, changelog generation, Git tagging, release archive
# creation and GitLab Release publication.
#
# Variables used by this template:
#
# - CI_PUSH_TOKEN (optional but recommended):
#   Personal Access Token or project token with permission to push commits
#   and tags to the repository. Typically configured as a protected CI/CD variable.
#
# - ACCESS_TOKEN (optional fallback):
#   Alternative token used as a fallback for Git HTTPS authentication.
#   Useful when repositories already rely on ACCESS_TOKEN for other publishing
#   workflows (e.g. GitLab Pages via Mike).
#
# - CI_BOT_EMAIL (optional):
#   Email address used for Git commits created during the release process.
#   Default: "ci@example.com"
#
# - CI_BOT_NAME (optional):
#   Git author name used for release commits.
#   Default: "CI Bot"
#
# - ZIP_PREFIX (optional):
#   Prefix used when generating the release archive filename.
#   Default: "release"
#
# - FORCE_RELEASE (optional):
#   If set to "1", enables a manual (play button) test mode on non-main branches.
#
# Requirements:
# - package.json must exist at the repository root (Node-based release workflow).
#
# Notes:
# - If no push token is available, the `release` job runs in "dry-run" mode:
#   it bumps the version, updates CHANGELOG.md, creates a tag and builds the ZIP,
#   but skips pushing commits/tags.
# - The `gitlab_release` job is executed only when a token is available.
#

# --------------------------------------------------
# Hidden template: version bump + tag creation + zip
# --------------------------------------------------
.release-template:
  stage: release
  image: node:20

  variables:
    ZIP_PREFIX: "release"

  script:
    - |
      set -e

      # 1) Install dependencies and configure Git identity
      npm install
      git config --global user.email "${CI_BOT_EMAIL:-ci@example.com}"
      git config --global user.name "${CI_BOT_NAME:-CI Bot}"
      git fetch --tags

      # 2) Bump version, generate changelog and create Git tag
      npx standard-version --message "chore(release): %s"

      # 3) Compute version/tag, create release archive
      VERSION=$(node -p "require('./package.json').version")
      TAG="v${VERSION}"
      ZIP_NAME="${ZIP_PREFIX}-${TAG}.zip"

      git archive --format=zip --output "$ZIP_NAME" "$TAG"

      # Export variables for downstream jobs
      echo "VERSION=${VERSION}" > tag.env
      echo "TAG=${TAG}" >> tag.env
      echo "ZIP_NAME=${ZIP_NAME}" >> tag.env

      # 4) Push changes and tags (if a token is available)
      PUSH_TOKEN="${CI_PUSH_TOKEN:-${ACCESS_TOKEN:-}}"

      if [ -z "${PUSH_TOKEN}" ]; then
        echo "⚠️ No push token available (CI_PUSH_TOKEN / ACCESS_TOKEN)."
        echo "Dry-run mode: commit/tag/archive generated locally, but push is skipped."
        exit 0
      fi

      git remote set-url origin "https://gitlab-ci-token:${PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git push origin "HEAD:${CI_COMMIT_REF_NAME}"
      git push origin --tags

  artifacts:
    name: "release-$CI_COMMIT_REF_NAME"
    paths:
      - release-v*.zip
    reports:
      dotenv: tag.env

  rules:
    - if: '$CI_COMMIT_TAG'
      when: never

    # Manual test mode for branches/MRs (opt-in) - only for Node projects
    - if: '$FORCE_RELEASE == "1"'
      exists:
        - package.json
      when: manual
      allow_failure: true

    # Normal behavior on main pushes - only for Node projects
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE !~ /^chore\(release\):/'
      exists:
        - package.json
      when: on_success

    - when: never

# --------------------------------------------------
# Hidden template: GitLab Release publication
# --------------------------------------------------
.gitlab-release-template:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest

  needs:
    - job: release
      artifacts: true

  script:
    - |
      set -e
      echo "Creating GitLab release for tag $TAG"
      ls -la

  release:
    tag_name: "$TAG"
    name: "Release $TAG"
    description: "$CI_COMMIT_MESSAGE"
    assets:
      links:
        - name: "Source Archive"
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/download"

  rules:
    - if: '$CI_COMMIT_TAG'
      when: never

    # Manual test mode: publish only if a token is available
    - if: '$FORCE_RELEASE == "1" && ($CI_PUSH_TOKEN || $ACCESS_TOKEN)'
      exists:
        - package.json
      when: manual
      allow_failure: true

    # Normal behavior on main pushes: publish only if a token is available
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push" && ($CI_PUSH_TOKEN || $ACCESS_TOKEN)'
      exists:
        - package.json
      when: on_success

    - when: never

# --------------------------------------------------
# Concrete jobs exposed to consuming projects
# --------------------------------------------------
release:
  extends: .release-template

gitlab_release:
  extends: .gitlab-release-template
