# release.gitlab-ci.yml
#
# Shared GitLab CI template implementing a release workflow:
# - version bump (standard-version)
# - changelog generation
# - Git tag creation
# - source archive (zip) creation
# - optional GitLab Release publication (release-cli)
#
# Variables used by this template:
#
# - CI_PUSH_TOKEN (recommended to publish a release):
#   Project access token / bot token with permission to push commits and tags.
#   Typically configured as a protected CI/CD variable in the consuming project.
#   If not set, the `release` job runs in "dry-run" mode (no push).
#
# - CI_BOT_EMAIL (optional):
#   Override Git author email for the release commit.
#   Default: GitLab-provided identity (GITLAB_USER_EMAIL), with a final fallback to "ci@example.com".
#
# - CI_BOT_NAME (optional):
#   Override Git author name for the release commit.
#   Default: GitLab-provided identity (GITLAB_USER_NAME), with a final fallback to "CI Bot".
#
# - ZIP_PREFIX (optional):
#   Prefix used when generating the release archive filename.
#   Default: CI_PROJECT_NAME (project name). Can be overridden if needed.
#
# - PUBLISH_GITLAB_RELEASE (optional):
#   If set to "1", enables GitLab Release publication via release-cli.
#   Default: disabled (opt-in), because some GitLab instances/projects may reject Release creation.
#
# Requirements:
# - package.json must exist at the repository root (Node-based release workflow).
#
# Notes:
# - Dry-run mode (no CI_PUSH_TOKEN): the job bumps version, updates CHANGELOG.md,
#   creates a local tag and builds the ZIP, but skips pushing commits/tags.
# - Branch-specific testing should be done by overriding job `rules` in the consuming project,
#   not by adding "force" logic in this shared template.
#

# --------------------------------------------------
# Hidden template: version bump + tag creation + zip
# --------------------------------------------------
.release-template:
  stage: release
  image: node:20

  script:
    - |
      set -e

      # 1) Install dependencies and configure Git identity (GitLab-native with overrides)
      npm install
      git config --global user.email "${CI_BOT_EMAIL:-${GITLAB_USER_EMAIL:-ci@example.com}}"
      git config --global user.name "${CI_BOT_NAME:-${GITLAB_USER_NAME:-CI Bot}}"
      git fetch --tags

      # 2) Bump version, generate changelog and create Git tag
      # NOTE: standard-version warns that --message will be deprecated in favor of --releaseCommitMessageFormat.
      npx standard-version --message "chore(release): %s"

      # 3) Compute version/tag, create release archive
      VERSION=$(node -p "require('./package.json').version")
      TAG="v${VERSION}"

      ZIP_PREFIX="${ZIP_PREFIX:-$CI_PROJECT_NAME}"
      ZIP_NAME="${ZIP_PREFIX}-${TAG}.zip"

      git archive --format=zip --output "$ZIP_NAME" "$TAG"

      # Export variables for downstream jobs
      echo "VERSION=${VERSION}" > tag.env
      echo "TAG=${TAG}" >> tag.env
      echo "ZIP_NAME=${ZIP_NAME}" >> tag.env

      # 4) Push changes and tags (if token is available)
      if [ -z "${CI_PUSH_TOKEN:-}" ]; then
        echo "⚠️ No CI_PUSH_TOKEN provided."
        echo "Dry-run mode: commit/tag/archive generated locally, but push is skipped."
        exit 0
      fi

      git remote set-url origin "https://gitlab-ci-token:${CI_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git push origin "HEAD:${CI_COMMIT_REF_NAME}"
      git push origin --tags

  artifacts:
    name: "release-$CI_COMMIT_REF_NAME"
    paths:
      - "*.zip"
    reports:
      dotenv: tag.env

  rules:
    - if: '$CI_COMMIT_TAG'
      when: never

    # Normal behavior on main pushes - only for Node projects
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE !~ /^chore\(release\):/'
      exists:
        - package.json
      when: on_success

    - when: never

# --------------------------------------------------
# Hidden template: GitLab Release publication
# --------------------------------------------------
.gitlab-release-template:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest

  needs:
    - job: release
      artifacts: true

  script:
    - |
      set -e

      # Dry-run mode: no TAG exported => skip
      if [ -z "${TAG:-}" ]; then
        echo "No TAG provided (dry-run mode). Skipping GitLab Release publication."
        exit 0
      fi

      echo "Creating GitLab release for tag $TAG"
      ls -la

  release:
    tag_name: "$TAG"
    name: "Release $TAG"
    description: "$CI_COMMIT_MESSAGE"
    assets:
      links:
        - name: "Source Archive"
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/download"

  rules:
    - if: '$CI_COMMIT_TAG'
      when: never

    # Opt-in publication, only on main, only when token exists
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push" && $PUBLISH_GITLAB_RELEASE == "1" && $CI_PUSH_TOKEN'
      exists:
        - package.json
      when: on_success

    - when: never

# --------------------------------------------------
# Concrete jobs exposed to consuming projects
# --------------------------------------------------
release:
  extends: .release-template

gitlab_release:
  extends: .gitlab-release-template
  allow_failure: true

