# doxygen.gitlab-ci.yml

# This GitLab CI configuration file sets up a job to generate documentation using Doxygen.
# The job uses an Alpine Linux image and installs the necessary Doxygen tools.
# It then runs Doxygen to generate the documentation and moves the generated files to the public directory.
# The DOXYFILE_PATH variable can be set to specify the directory containing the Doxygen configuration file. If not set, it defaults to src.

image: alpine

.doxygen-template:
  stage: pages
  script:
    - apk add doxygen
    - echo "Running Doxygen on ${DOXYFILE_PATH:-src}"
    - cd $DOXYFILE_PATH
    - doxygen doxygen/Doxyfile
    - cd $CI_PROJECT_DIR
    - mv $DOXYFILE_PATH/doxygen/documentation/html/ public/
  artifacts:
    paths:
      - public/

pages:
  extends: .doxygen-template
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /publication/
