# platformio.gitlab-ci.yml
#
# Shared GitLab CI configuration for building firmware using PlatformIO.
#
# DESIGN CHOICE:
# - A hidden template job defines the reusable PlatformIO build logic.
# - A concrete job (`pio-build`) is exposed so consuming projects only need
#   to include this file to enable firmware builds.
#
# This follows the "plug-and-play" CI template convention:
# including this file is sufficient to get a default PlatformIO build job.
#
# The consuming project is responsible for:
# - Defining the pipeline stages (including a `build` stage)
# - Providing the `PIO_ENV` variable corresponding to the PlatformIO environment

# --------------------------------------------------
# Hidden template: PlatformIO firmware build
# --------------------------------------------------
.platformio-build-template:
  stage: build
  image: python:3.11

  before_script:
    # Install system dependencies required by PlatformIO
    - apt-get update
    - apt-get install -y --no-install-recommends nodejs

    # Install PlatformIO Core
    - pip install --no-cache-dir -U platformio

  script:
    # Build firmware using the environment defined by PIO_ENV
    - pio run

# --------------------------------------------------
# Concrete job exposed to consuming projects
#
# This job is executed automatically when this file is included.
# Project-specific behavior (rules, allow_failure, etc.) can be
# overridden locally if needed.
# --------------------------------------------------
pio-build:
  extends: .platformio-build-template




