# clang.gitlab-ci.yml
image: alpine:latest

.clang-format-template:
  stage: format
  script:
    - apk update
    - apk add --no-cache findutils
    - apk add --no-cache clang18-extra-tools
    - ln -sf /usr/lib/llvm18/bin/clang-format /usr/local/bin/clang-format
    - clang-format --version
    - echo "Running clang-format on files in ${CLANG_PATH:-.} with configuration from ${CLANG_FORMAT_FILE:-.clang-format}"
    - find ${CLANG_PATH:-.} \( -name '*.c' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -exec clang-format --dry-run --Werror --style=file:${CLANG_FORMAT_FILE:-.clang-format} {} +

format-clang:
  extends: .clang-format-template

.clang-tidy-template:
  stage: format
  script:
    - apk update
    - apk add --no-cache python3 py3-pip git bash curl unzip
    - python3 -m venv .venv
    - . .venv/bin/activate
    - pip install -U pip
    - pip install -U platformio
    - platformio --version
    - echo "Running PlatformIO check (clang-tidy) for env: ${PIO_ENV}"
    - pio check --environment "${PIO_ENV}"

clang-tidy:
  extends: .clang-tidy-template
  stage: format
  allow_failure: true
  cache:
    key: platformio
    paths:
      - .venv/
      - .platformio/
      - ~/.platformio/















