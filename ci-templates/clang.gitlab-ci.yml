# clang.gitlab-ci.yml
#
# Shared GitLab CI templates and jobs for clang-based code quality checks.
#
# DESIGN CHOICE:
# - Hidden template jobs (prefixed with a dot) define reusable building blocks.
# - Concrete jobs (clang-format, clang-tidy) are defined in this file so that
#   consuming projects can simply include this template without redefining jobs.
# - Projects may still override behavior if needed by redefining jobs locally.
#
# This follows the "plug-and-play" template convention:
# including this file is sufficient to get the default jobs executed.
#
# Toolchain compatibility:
# - clang-format is toolchain-agnostic and can run on any C/C++ codebase.
# - clang-tidy implementation below relies on PlatformIO.
#
# IMPORTANT:
# - The clang-tidy job is automatically skipped if no `platformio.ini` file
#   is found at the repository root.
# - This makes the template safe to include in non-PlatformIO projects
#   (including this CI template repository itself).
#

# --------------------------------------------------
# Hidden template: clang-format (Alpine + LLVM tools)
# --------------------------------------------------
.clang-format-template:
  stage: format
  image: alpine:latest

  script:
    # Install required tooling
    - apk update
    - apk add --no-cache findutils clang21-extra-tools

    # Ensure clang-format is available on PATH
    - ln -sf /usr/lib/llvm21/bin/clang-format /usr/local/bin/clang-format
    - clang-format --version

    # Run clang-format in check mode
    - |
      set -e
      echo "Running clang-format on ${CLANG_PATH:-.} (config: ${CLANG_FORMAT_FILE:-.clang-format})"
      find ${CLANG_PATH:-.} \( -name '*.c' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) \
        -exec clang-format --dry-run --Werror --style=file:${CLANG_FORMAT_FILE:-.clang-format} {} +

# --------------------------------------------------
# Hidden template: clang-tidy (PlatformIO implementation)
#
# This template runs clang-tidy via `pio check` to leverage PlatformIO's
# compilation database and environment settings.
#
# NOTE:
# - This job assumes a valid PlatformIO project structure.
# - Execution is controlled at the concrete job level via `rules`.
# --------------------------------------------------
.clang-tidy-template:
  stage: format
  image: python:3.11

  variables:
    # Allow caching PlatformIO packages and build artifacts
    PLATFORMIO_CORE_DIR: "$CI_PROJECT_DIR/.pio"

  cache:
    key: platformio
    paths:
      - .pio/

  script:
    - |
      set -e
      apt-get update
      apt-get install -y --no-install-recommends git
      pip install --no-cache-dir -U platformio
      platformio --version
      echo "Running PlatformIO check (clang-tidy) for env: ${PIO_ENV:-adafruit_feather_m0}"
      pio check --environment "${PIO_ENV:-adafruit_feather_m0}"

# --------------------------------------------------
# Concrete jobs exposed to consuming projects
#
# These jobs are executed automatically when this file is included.
# --------------------------------------------------

# Code formatting check (always enabled)
clang-format:
  extends: .clang-format-template

# Static analysis (clang-tidy via PlatformIO)
#
# This job is executed only if a `platformio.ini` file exists
# at the repository root.
#
# This prevents failures when the template is included in:
# - non-PlatformIO projects
# - CI template libraries
#
clang-tidy:
  extends: .clang-tidy-template
  rules:
    - exists:
        - platformio.ini
    - when: never
