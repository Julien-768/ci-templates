# clang.gitlab-ci.yml

image: alpine:latest

format:
  stage: format
  script:
  - apk update
  - apk add clang18-extra-tools
  - ln -s /usr/lib/llvm18/bin/clang-format /usr/local/bin/clang-format
  - clang-format --version
  - echo "Running clang-format on files in $CLANG_PATH"
  - find $CLANG_PATH \( -name '*.c' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) | xargs --no-run-if-empty clang-format --dry-run --Werror
