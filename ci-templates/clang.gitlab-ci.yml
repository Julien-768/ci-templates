# clang.gitlab-ci.yml
image: alpine:latest

.clang-format-template:
  stage: format
  script:
    - apk update
    - apk add --no-cache findutils
    - apk add --no-cache clang18-extra-tools
    - ln -sf /usr/lib/llvm18/bin/clang-format /usr/local/bin/clang-format
    - clang-format --version
    - echo "Running clang-format on files in ${CLANG_PATH:-.} with configuration from ${CLANG_FORMAT_FILE:-.clang-format}"
    - find ${CLANG_PATH:-.} \( -name '*.c' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -exec clang-format --dry-run --Werror --style=file:${CLANG_FORMAT_FILE:-.clang-format} {} +

format-clang:
  extends: .clang-format-template

.clang-tidy-template:
  stage: format
  script:
    - apk update
    - apk add --no-cache clang18-extra-tools python3 py3-pip git bash curl unzip
    - ln -sf /usr/lib/llvm18/bin/clang-tidy /usr/local/bin/clang-tidy
    - clang-tidy --version

    # Optional: command to generate compile_commands.json (PlatformIO, CMake, etc.)
    - |
      if [ -n "${CLANG_TIDY_GEN_CMD}" ]; then
        echo "Generating compile_commands.json via: ${CLANG_TIDY_GEN_CMD}"
        sh -lc "${CLANG_TIDY_GEN_CMD}"
      else
        echo "CLANG_TIDY_GEN_CMD is empty. Expecting compile_commands.json in ${CLANG_TIDY_BUILD_DIR:-.}"
      fi

    - test -f "${CLANG_TIDY_BUILD_DIR:-.}/compile_commands.json"

    - |
      if [ -x /usr/lib/llvm18/share/clang/run-clang-tidy.py ]; then
        python3 /usr/lib/llvm18/share/clang/run-clang-tidy.py -p "${CLANG_TIDY_BUILD_DIR:-.}" ${CLANG_TIDY_PATH:-src}
      else
        run-clang-tidy -p "${CLANG_TIDY_BUILD_DIR:-.}" ${CLANG_TIDY_PATH:-src}
      fi

clang-tidy:
  extends: .clang-tidy-template
  rules:
    - if: '$CLANG_TIDY_ENABLE == "1"'


