# clang.gitlab-ci.yml

# ------------------------------
# clang-format (Alpine)
# ------------------------------
image: alpine:latest

.clang-format-template:
  stage: format
  script:
    - apk update
    - apk add --no-cache findutils clang18-extra-tools
    - ln -sf /usr/lib/llvm18/bin/clang-format /usr/local/bin/clang-format
    - clang-format --version
    - echo "Running clang-format on ${CLANG_PATH:-.} (config: ${CLANG_FORMAT_FILE:-.clang-format})"
    - find ${CLANG_PATH:-.} \( -name '*.c' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) \
        -exec clang-format --dry-run --Werror --style=file:${CLANG_FORMAT_FILE:-.clang-format} {} +

format-clang:
  extends: .clang-format-template

# ------------------------------
# clang-tidy via PlatformIO
# ------------------------------
.clang-tidy-template:
  image: platformio/platformio-core:latest
  stage: format
  cache:
    key: platformio
    paths:
      - .platformio/
      - /root/.platformio/
  script:
    - |
      set -e
      platformio --version
      echo "Running PlatformIO check (clang-tidy) for env: ${PIO_ENV:-adafruit_feather_m0}"
      pio check --environment "${PIO_ENV:-adafruit_feather_m0}"

clang-tidy:
  extends: .clang-tidy-template
  stage: format
  allow_failure: true



















