# clang.gitlab-ci.yml
image: alpine:latest

# ------------------------------
# clang-format
# ------------------------------
.clang-format-template:
  stage: format
  script:
    - apk update
    - apk add --no-cache findutils
    - apk add --no-cache clang18-extra-tools
    - ln -sf /usr/lib/llvm18/bin/clang-format /usr/local/bin/clang-format
    - clang-format --version
    - echo "Running clang-format on files in ${CLANG_PATH:-.} with configuration from ${CLANG_FORMAT_FILE:-.clang-format}"
    - find ${CLANG_PATH:-.} \( -name '*.c' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -exec clang-format --dry-run --Werror --style=file:${CLANG_FORMAT_FILE:-.clang-format} {} +

format-clang:
  extends: .clang-format-template

# ------------------------------
# clang-tidy via PlatformIO
# ------------------------------
.clang-tidy-template:
  stage: format
  cache:
    key: platformio
    paths:
      - .venv/
      - .platformio/
      - /root/.platformio/
  script:
    - |
      set -e
      apk update
      apk add --no-cache python3 py3-pip git bash curl unzip clang18-extra-tools

      # clang-tidy system (works on Alpine)
      ln -sf /usr/lib/llvm18/bin/clang-tidy /usr/local/bin/clang-tidy
      clang-tidy --version

      python3 -m venv .venv
      . .venv/bin/activate
      pip install -U pip
      pip install -U platformio
      platformio --version

      # Force-install PlatformIO tool package, then patch missing binary path expected by PlatformIO
      pio pkg install -g -p platformio/tool-clangtidy
      PKGDIR="/root/.platformio/packages/tool-clangtidy"
      mkdir -p "${PKGDIR}"
      ln -sf "$(command -v clang-tidy)" "${PKGDIR}/clang-tidy"
      mkdir -p "${PKGDIR}/bin"
      ln -sf "$(command -v clang-tidy)" "${PKGDIR}/bin/clang-tidy"

      echo "Running PlatformIO check (clang-tidy) for env: ${PIO_ENV:-adafruit_feather_m0}"
      pio check --environment "${PIO_ENV:-adafruit_feather_m0}"


















