# mike.gitlab-ci.yml

image: python:latest

variables:
  GIT_DEPTH: 0

before_script:
  - time pip install -r requirements.txt

mkdocs_test:
  stage: test
  script:
    - time mkdocs build --strict --verbose --site-dir test
  artifacts:
    paths:
      - test
    expire_in: 24 hours

pages:
  stage: pages
  when: on_success
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PAGES_BRANCH: gl-pages
    HTTPS_REMOTE: https://gitlab-ci-token:${ACCESS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git
  before_script:
    - time pip install -r requirements.txt
    - time git config user.name $GITLAB_USER_NAME
    - time git config user.email $GITLAB_USER_EMAIL
    - time git fetch origin $PAGES_BRANCH && git checkout -b $PAGES_BRANCH origin/$PAGES_BRANCH || echo "Pages branch not deployed yet."
    - time git checkout $CI_COMMIT_SHA
  script:
    - echo $HTTPS_REMOTE
    - time mike deploy --deploy-prefix public -r $HTTPS_REMOTE -p -b $PAGES_BRANCH -u $CI_COMMIT_TAG latest
    - time mike set-default --deploy-prefix public -r $HTTPS_REMOTE -p -b $PAGES_BRANCH latest
    - time git checkout $PAGES_BRANCH -- public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_MESSAGE=~ /publication/
