# mkdocs.gitlab-ci.yml

# This GitLab CI configuration file sets up jobs to build and deploy documentation using MkDocs.
# The mkdocs_test job builds the documentation and stores the output in the test directory.
# The pages job builds the documentation and stores the output in the public directory for deployment to GitLab Pages.

variables:
  MKDOCS_CONFIG_FILE: 'mkdocs.yml' # optional path to the MkDocs configuration file

mkdocs_test:
  stage: test
  image: python:latest
  script:
    - time pip install -r requirements.txt
    - time mkdocs build --strict --verbose --site-dir test -f ${MKDOCS_CONFIG_FILE=-.mkdocs.yml}
  artifacts:
    paths:
      - test
    expire_in: 24 hours

mkdocs_pages:
  stage: pages
  image: python:latest
  script:
    - time pip install -r requirements.txt
    - time mkdocs build --strict --verbose --site-dir public -f ${MKDOCS_CONFIG_FILE:-.mkdocs.yml}
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_MESSAGE=~ /publication/
