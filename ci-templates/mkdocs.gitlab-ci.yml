#mkdocs.gitlab-ci.yml

image: python:latest

mkdocs_test:
  stage: test
  script:
    - time pip install -r requirements.txt
    - time mkdocs build --strict --verbose --site-dir test
  artifacts:
    paths:
      - test
    expire_in: 24 hours

pages:
  stage: pages
  script:
    - time pip install -r requirements.txt
    - time mkdocs build --strict --verbose --site-dir public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_MESSAGE=~ /publication/
