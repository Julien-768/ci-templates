# platformio.gitlab-ci.yml
#
# Shared GitLab CI template for building embedded firmware using PlatformIO.
#
# This template installs PlatformIO Core and runs a default firmware build
# using the environments defined in the project's `platformio.ini` file.
#
# Consuming projects include this file to enable a standard PlatformIO build
# without redefining build logic.
#
# Variables used by this template:
# - (none)
#
# Behavior:
# - The build job is executed only if a `platformio.ini` file is present
#   at the repository root.
# - This makes the template safe to include in non-PlatformIO repositories,
#   including the ci-templates library itself.
#

# --------------------------------------------------
# Hidden template: PlatformIO firmware build
# --------------------------------------------------
.platformio-build-template:
  stage: build
  image: python:3.11

  before_script:
    # Install system dependencies required by PlatformIO
    - apt-get update
    - apt-get install -y --no-install-recommends nodejs

    # Install PlatformIO Core
    - pip install --no-cache-dir -U platformio

  script:
    # Build firmware using environments defined in platformio.ini
    - pio run

# --------------------------------------------------
# Concrete job exposed to consuming projects
#
# This job is executed automatically when this file is included.
# The job is skipped if no `platformio.ini` file is found.
#
# Project-specific behavior (rules, allow_failure, etc.) can still be
# overridden locally if needed.
# --------------------------------------------------
pio-build:
  extends: .platformio-build-template
  rules:
    - exists:
        - platformio.ini
    - when: never
