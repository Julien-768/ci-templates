# CI job for Markdown linting
#
# Uses markdownlint-cli2 to check Markdown files for style issues.
#
# MK_PATH (optional)
# ------------------
# Defines the root directory where Markdown files are searched.
# Defaults to "docs" if not set.
# Use "." to lint the whole repository.
#
# Example (in consuming project):
#   variables:
#     MK_PATH: "."
#
# Configuration files
# -------------------
# The job respects:
# - .markdownlint.json      → rule configuration
# - .markdownlintignore     → file exclusions
#
# Notes about ignores
# -------------------
# - If MK_PATH is ".", the repository root is linted and files like CHANGELOG.md
#   will be included unless excluded in .markdownlintignore.
# - Some environments can end up linting markdownlint dotfiles; we explicitly
#   ignore them via CLI to avoid false positives (e.g., MD041 on .markdownlintignore).
#
# Implementation details
# ----------------------
# - Uses glob pattern: "${MK_PATH}/**/*.md"
# - Relies on markdownlint-cli2 native glob + ignore handling
# - Safe if .markdownlintignore is missing
#
# Recommended .markdownlintignore entries
# --------------------------------------
#   **/CHANGELOG.md
#   .git/
#   node_modules/
#   .pio/
#
# --------------------------------------------------

.markdown-lint-template:
  stage: lint
  image: node:18
  before_script:
    - npm config set fund false
    - npm config set audit false
    - npm i -D markdownlint-cli2
  script:
    - |
      set -e
      ROOT="${MK_PATH:-docs}"

      IGNORE_OPT=""
      if [ -f .markdownlintignore ]; then
        IGNORE_OPT="--ignore-path .markdownlintignore"
      fi

      npx markdownlint-cli2 \
        --config .markdownlint.json \
        ${IGNORE_OPT} \
        --ignore ".markdownlintignore" \
        --ignore ".markdownlint.json" \
        -- "${ROOT}/**/*.md"

Markdown Lint:
  extends: .markdown-lint-template