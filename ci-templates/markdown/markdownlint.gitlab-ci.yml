# CI job for Markdown linting
#
# Uses markdownlint-cli2 to check Markdown files for style issues.
#
# MK_PATH (optional) defines the root directory where Markdown files are searched.
# Defaults to "docs" if not set. Use "." to lint the whole repository.
#
# The job respects:
# - .markdownlint.json      → rule configuration
# - .markdownlintignore     → file exclusions (e.g. CHANGELOG.md, .pio/)
#
# This implementation avoids using `find` so that markdownlint-cli2
# can properly handle glob patterns and ignore files.
# --------------------------------------------------

.markdown-lint-template:
  stage: lint
  image: node:18
  before_script:
    - npm config set fund false
    - npm config set audit false
    - npm i -D markdownlint-cli2
  script:
    - |
      set -e
      ROOT="${MK_PATH:-docs}"
      npx markdownlint-cli2 --config .markdownlint.json -- "${ROOT}/**/*.md"

Markdown Lint:
  extends: .markdown-lint-template