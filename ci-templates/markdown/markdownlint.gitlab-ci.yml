# CI job for Markdown linting
#
# Uses markdownlint-cli (Node-based) to check Markdown files for style issues.
#
# MK_PATH (optional)
# ------------------
# Root directory where Markdown files are searched.
# Defaults to "docs" if not set.
# Use "." to lint the whole repository.
#
# Configuration files (repository root)
# ------------------------------------
# - .markdownlint.json      → rule configuration
# - .markdownlintignore     → file exclusions (native support in markdownlint-cli)
#
# Notes
# -----
# - Uses glob pattern: "${MK_PATH}/**/*.md"
# - If you lint the whole repo (MK_PATH="."), exclude generated/vendor dirs
#   in .markdownlintignore (e.g., node_modules/, .pio/, .git/).
#
# --------------------------------------------------

.markdown-lint-template:
  stage: lint
  image: node:18
  before_script:
    - npm config set fund false
    - npm config set audit false
    - npm i -D markdownlint-cli
  script:
    - |
      set -eu
      ROOT="${MK_PATH:-docs}"

      # markdownlint-cli automatically reads .markdownlintignore if present
      npx markdownlint \
        --config .markdownlint.json \
        "${ROOT}/**/*.md"

Markdown Lint:
  extends: .markdown-lint-template