# markdownlint.gitlab-ci.yml
# Shared GitLab CI template for Markdown linting (markdownlint-cli).
# Variable (optional):
# - MK_PATH: Root directory to lint (default: "docs"; use "." to lint the whole repo).
# Configuration (repo root):
# - .markdownlint.json (rules)
# - .markdownlintignore (exclusions; auto-read by markdownlint-cli)
# Notes: Uses glob "${MK_PATH:-docs}/**/*.md".

# --------------------------------------------------
# Hidden template: Markdown lint job
# --------------------------------------------------
.markdown-lint-template:
  stage: lint
  image: node:18

  before_script:
    - npm config set fund false
    - npm config set audit false
    - npm i -D markdownlint-cli

  script:
    - |
      set -eu
      # markdownlint-cli automatically reads .markdownlintignore if present
      npx markdownlint --config .markdownlint.json "${MK_PATH:-docs}/**/*.md"

# --------------------------------------------------
# Concrete job exposed to consuming projects
# --------------------------------------------------
Markdown Lint:
  extends: .markdown-lint-template