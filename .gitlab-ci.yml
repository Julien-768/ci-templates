# .gitlab-ci.yml

# This GitLab CI configuration file sets up the pipeline stages and includes the
# shared CI templates from this repository (local includes).
#
# Stages:
# - format: code formatting checks (clang-format / clang-tidy)
# - lint: static checks (python, markdownlint, eslint/prettier)
# - build: firmware (PlatformIO, GNU Arm Embedded) and application (Windows installer) builds
# - test: documentation build/tests (mkdocs)
# - pages: publication jobs (mike, doxygen)
# - release: versioning/tagging/archive/release publication

stages:
- format
- lint
- build
- build-exe
- build-installer
- test
- pages
- release

include:
# --- Format stage ---
- local: "templates/clang/template.yml"

# --- Lint stage ---
- local: "templates/python/template.yml"
  inputs:
    RUN_ISORT: "true" # Enable/disable isort
    RUN_BLACK: "true" # Enable/disable black
    RUN_FLAKE8: "true" # Enable/disable flake8
    RUN_PYLINT: "true" # Enable/disable pylint
    PYLINT_RCFILE: "$PYLINT_RCFILE" # Use the global variable defined below

- local: "templates/ruff/template.yml"
- local: "templates/markdown/template.yml"
- local: "templates/eslint/template.yml"

# --- Build stage ---
- local: "templates/platformio/template.yml"
  inputs:
    environments: "clangtidy"
    project_dir: "."
    project_conf: "platformio.ini"

- local: "templates/gcc/template.yml"

- local: "templates/python-windows-installer/template.yml"
  inputs:
    project_dir: "."
    app_name: DummyApp
    exe_name: MainApp
    app_version: "0.0.1-test"
    app_id: DUMMY-APP-TEST-0001
    main_script: "src/main.py"
    output_dir: "release"

# --- Test stage ---
- local: "templates/python-compile/template.yml"
  inputs:
    source_dir: "."
    install_project: "false"

- local: "templates/mkdocs/template.yml"
- local: "templates/mike/template.yml"

# --- Pages stage ---
- local: "templates/doxygen/template.yml"

# --- Release stage ---
- local: "templates/release/template.yml"

variables:
  CLANG_PATH: "src" # optional path to the C/C++ source files
  CLANG_FORMAT_FILE: ".clang-format.yml" # optional path to the clang-format configuration file
  DOXYFILE_PATH: "src" # optional path to the Doxygen configuration file
  LINT_PATH: "src" # optional path for source-code linting (non-Markdown)
  MD_PATH: "." # optional root for Markdown linting (default: lint all)
  MK_PATH: "src" # MkDocs project directory (contains mkdocs.yml + requirements.txt)
  ZIP_PREFIX: "release" # optional prefix for the release zip file
  PIO_ENV: "clangtidy" # optional PlatformIO environment for clang-tidy job
