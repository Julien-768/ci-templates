stages:
  - format
  - lint
  - test
  - pages
  - deployment

include:
  - local: 'ci-templates/python.gitlab-ci.yml'
  - local: 'ci-templates/mkdocs.gitlab-ci.yml'
  - local: 'ci-templates/mike.gitlab-ci.yml'
  - local: 'ci-templates/eslint-prettier.gitlab-ci.yml'
  - local: 'ci-templates/doxygen.gitlab-ci.yml'
  - local: 'ci-templates/clang.gitlab-ci.yml'

format-clang::
  extends: format-clang
  allow_failure: true

# Example job to test the inclusion of the templates
test_python_template:
  stage: test
  image: python:latest
  script:
    - echo "Testing Python template"
    - pip install isort black flake8 pylint
    - isort . --check-only
    - black --check .
    - flake8 .
    - find . -type f -name "*.py" | xargs pylint --rcfile=pyproject.toml

test_mkdocs_template:
  stage: test
  image: python:latest
  script:
    - echo "Testing MkDocs template"
    - pip install -r requirements.txt
    - mkdocs build --strict --verbose --site-dir test

test_mike_template:
  stage: test
  image: python:latest
  script:
    - echo "Testing Mike template"
    - pip install -r requirements.txt
    - mkdocs build --strict --verbose --site-dir test

test_eslint_prettier_template:
  stage: test
  image: node:16.15-alpine3.14
  script:
    - echo "Testing ESLint-Prettier template"
    - npm i -g prettier@2.6.2 prettier-plugin-svelte@2.7.0 eslint@8.16.0
    - npm i -D eslint-config-prettier@8.5.0 eslint-plugin-jest@26.4.6 eslint-plugin-svelte3@4.0.0
    - prettier --check --no-config --ignore-path .eslintignore . && eslint . || exit_code=$?
    - if [[ $exit_code -eq 1 ]]; then
        echo "❌ Some FE code or non-Python files aren't formatted or linted. Ensure that you have pre-commit hooks installed locally.";
      fi
    - exit $exit_code

test_doxygen_template:
  stage: test
  image: alpine:latest
  script:
    - echo "Testing Doxygen template"
    - apk add doxygen
    - doxygen doxygen/Doxyfile

test_clang_template:
  stage: test
  image: alpine:latest
  script:
    - echo "Testing Clang template"
    - apk add clang18-extra-tools
    - find $CLANG_PATH -type f \( -name '*.c' -or -name '*.h' \) -print0 | xargs -0 clang-format -i
