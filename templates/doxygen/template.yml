# template.yml
#
# Shared GitLab CI component for Doxygen documentation generation.
# Input:
# - doxyfile_path: path to the directory containing the project's `doxygen/` folder.
#   Default: "."
# Documentation is generated only when the commit message contains "publication".

spec:
  inputs:
    doxyfile_path:
      default: "."
      description: Path to the directory containing the project's `doxygen/` folder
---

.doxygen-template:
  stage: pages
  image: alpine:latest
  dependencies: []
  needs: []

  variables:
    CI_TEMPLATES_PROJECT: "iphc/ci-templates"
    CI_TEMPLATES_REF: "develop"

  script:
  - apk add --no-cache doxygen graphviz curl
  - echo "Running Doxygen in $[[ inputs.doxyfile_path ]]"
  - cd "$[[ inputs.doxyfile_path ]]"
  - mkdir -p doxygen
  - >
    curl --fail --location "$CI_SERVER_URL/$CI_TEMPLATES_PROJECT/-/raw/$CI_TEMPLATES_REF/templates/doxygen/Doxyfile.base" -o doxygen/Doxyfile.base
  - doxygen doxygen/Doxyfile
  - cd "$CI_PROJECT_DIR"
  - mv "$[[ inputs.doxyfile_path ]]/doxygen/documentation/html" public

  artifacts:
    paths:
    - public/

doxygen:
  extends: .doxygen-template
  rules:
  - if: '$CI_COMMIT_TAG'
    when: never
  - if: '$CI_COMMIT_MESSAGE =~ /publication/i'
    when: on_success
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    when: on success
  - when: never
