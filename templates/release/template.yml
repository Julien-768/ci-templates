# release/template.yml
#
# GitLab CI/CD Component Catalog template for release automation.
# Bumps version, updates changelog, tags, archives and optionally publishes a GitLab Release.
# Triggered only on main push when commit title contains: release: trigger
# Inputs: stage, ci_push_token, ci_bot_email, ci_bot_name, zip_prefix.

spec:
  inputs:
    stage:
      default: release
    ci_push_token:
      default: ""
    ci_bot_email:
      default: "ci@example.com"
    ci_bot_name:
      default: "CI Bot"
    zip_prefix:
      default: ""
---

.release-template:
  stage: $[[ inputs.stage ]]
  image: node:20

  script:
  - |
    set -e

    npm install
    git config --global user.email "$[[ inputs.ci_bot_email ]]"
    git config --global user.name "$[[ inputs.ci_bot_name ]]"

    git fetch --prune
    git tag -l | xargs -r git tag -d
    git fetch --tags --prune --prune-tags

    BEFORE_RELEASE_COMMIT="$(git rev-parse HEAD)"

    if ! npx standard-version --message "chore(release): %s"; then
      echo "Release failed. Rolling back local changes."
      git reset --hard "$BEFORE_RELEASE_COMMIT"
      git clean -fd
      exit 1
    fi

    TAG="$(git describe --tags --abbrev=0)"
    VERSION="${TAG#v}"

    ZIP_PREFIX="$[[ inputs.zip_prefix ]]"
    ZIP_PREFIX="${ZIP_PREFIX:-$CI_PROJECT_NAME}"
    ZIP_NAME="${ZIP_PREFIX}-${TAG}.zip"

    echo "Creating archive for ${TAG} -> ${ZIP_NAME}"
    git archive --format=zip --output "$ZIP_NAME" "$TAG"

    echo "VERSION=${VERSION}" > tag.env
    echo "TAG=${TAG}" >> tag.env
    echo "ZIP_NAME=${ZIP_NAME}" >> tag.env

    if [ -z "$[[ inputs.ci_push_token ]]" ]; then
      echo "No ci_push_token provided."
      echo "Dry-run mode: commit/tag/archive generated locally, but push is skipped."
      exit 0
    fi

    git remote set-url origin "https://gitlab-ci-token:$[[ inputs.ci_push_token ]]@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    git push -o ci.skip origin "HEAD:${CI_COMMIT_REF_NAME}"
    git push -o ci.skip origin --tags

  artifacts:
    name: "release-$CI_COMMIT_REF_NAME"
    paths:
    - "*.zip"
    reports:
      dotenv: tag.env

  rules:
  - if: '$CI_COMMIT_TAG'
    when: never

  - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TITLE =~ /release: trigger/'
    exists:
    - package.json
    when: on_success

  - when: never

.gitlab-release-template:
  stage: $[[ inputs.stage ]]
  image: registry.gitlab.com/gitlab-org/release-cli:latest

  needs:
  - job: release
    artifacts: true

  script:
  - |
    set -e

    if [ -z "${TAG:-}" ]; then
      echo "No TAG provided (dry-run mode). Skipping GitLab Release publication."
      exit 0
    fi

    echo "Creating GitLab release for tag $TAG (best-effort)"

    ASSET_URL="$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_REF_NAME/download?job=release"

    release-cli create \
      --tag-name "$TAG" \
      --name "Release $TAG" \
      --description "$(printf '%s\n\nSource archive: %s\n' "$CI_COMMIT_MESSAGE" "$ASSET_URL")" \
    || {
      echo "GitLab release creation failed (ignored)."
      exit 0
    }

  rules:
  - if: '$CI_COMMIT_TAG'
    when: never

  - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TITLE =~ /release: trigger/'
    when: on_success

  - when: never

release:
  extends: .release-template

gitlab_release:
  extends: .gitlab-release-template
  allow_failure: true
