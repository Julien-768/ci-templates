# markdownlint.gitlab-ci.yml
# Shared GitLab CI template for Markdown linting (markdownlint-cli).
# Variable (optional):
# - MD_PATH: Root directory to lint (default: ".", use "docs" to restrict).
# Config (repo root):
# - .markdownlint.json (rules)
# - .markdownlintignore (optional exclusions; used only if present)
# Notes: Uses glob "${MD_PATH:-.}/**/*.md".

# --------------------------------------------------
# Hidden template: Markdown lint job
# --------------------------------------------------
.markdown-lint-template:
  stage: lint
  image: node:22
  dependencies: []

  script:
  - npm config set fund false
  - npm config set audit false
  - npm i -D markdownlint-cli
  - |
    set -eu
    IGNORE_ARGS=""
    if [ -f .markdownlintignore ]; then
      IGNORE_ARGS="--ignore-path .markdownlintignore"
    fi
    npx markdownlint --config .markdownlint.json $IGNORE_ARGS "${MD_PATH:-.}/**/*.md"

# --------------------------------------------------
# Concrete job exposed to consuming projects
# --------------------------------------------------
Markdown Lint:
  extends: .markdown-lint-template
