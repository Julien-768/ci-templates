# markdownlint.gitlab-ci.yml
# Shared GitLab CI template for Markdown linting (markdownlint-cli).
# Variable (optional):
# - MD_PATH: Root directory to lint (default: ".", use "docs" to restrict).
# Config (repo root):
# - .markdownlint.json (rules)
# - .markdownlintignore (exclusions; auto-read)
# Notes: Uses glob "${MD_PATH:-.}/**/*.md".

# --------------------------------------------------
# Hidden template: Markdown lint job
# --------------------------------------------------
.markdown-lint-template:
  stage: lint
  image: node:20

  before_script:
    - npm config set fund false
    - npm config set audit false
    - npm i -D markdownlint-cli

  script:
    - |
      set -eu
      npx markdownlint --config .markdownlint.json "${MD_PATH:-.}/**/*.md"

# --------------------------------------------------
# Concrete job exposed to consuming projects
# --------------------------------------------------
Markdown Lint:
  extends: .markdown-lint-template