
# template.yml
#
# Shared GitLab CI component for building embedded firmware
# using the GNU Arm Embedded Toolchain (arm-none-eabi-gcc).

spec:
  inputs:
    stage:
      default: build
      description: "CI stage used for the firmware build."
    gcc_make_dir:
      description: "Directory containing the Makefile to build."
    sdk_path:
      default: ""
      description: "SDK path forwarded to Make as SDK_PATH."
    extra_make_args:
      default: ""
      description: "Additional Make arguments (e.g. TARGET=foo VERBOSE=1)."

---

gcc-embedded:
  stage: $[[ inputs.stage ]]
  image: debian:stable-slim

  dependencies: []
  needs: []

  script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates make gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
    - rm -rf /var/lib/apt/lists/*
    - |
      if [ ! -f "$[[ inputs.gcc_make_dir ]]/Makefile" ]; then
        echo "ERROR: Makefile not found in $[[ inputs.gcc_make_dir ]]"
        exit 1
      fi
    - |
      make -C "$[[ inputs.gcc_make_dir ]]" \
        "SDK_PATH=$[[ inputs.sdk_path ]]" \
        $[[ inputs.extra_make_args ]]
