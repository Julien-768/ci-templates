# clang.gitlab-ci.yml
#
# Shared GitLab CI templates and jobs for clang-based code quality checks.

# Variables used by this template:
#
# - CLANG_PATH:
#   Directory or directories to scan for C/C++ source files.
#   Default: "."
#
# - CLANG_FORMAT_FILE:
#   Path to the clang-format configuration file.
#   Default: ".clang-format"
#
# - PIO_ENV:
#   PlatformIO environment name used by the clang-tidy job.
#   Default: "adafruit_feather_m0"

# --------------------------------------------------
# Hidden template: clang-format (Alpine + LLVM tools)
# --------------------------------------------------
.clang-format-template:
  stage: format
  image: alpine:latest
  dependencies: []
  needs: []

  script:
  - apk update
  - apk add --no-cache findutils clang22-extra-tools
  - ln -sf /usr/lib/llvm22/bin/clang-format /usr/local/bin/clang-format
  - clang-format --version
  - |
    set -eu

    CLANG_PATHS="${CLANG_PATH:-.}"
    CLANG_FORMAT_FILE="${CLANG_FORMAT_FILE:-.clang-format}"

    echo "Running clang-format on ${CLANG_PATHS} (config: ${CLANG_FORMAT_FILE})"

    # shellcheck disable=SC2086
    find ${CLANG_PATHS} -type f \( -name '*.c' -o -name '*.h' \) \
      -exec clang-format \
        --dry-run \
        --Werror \
        --style="file:${CLANG_FORMAT_FILE}" \
        {} +

# --------------------------------------------------
# Hidden template: clang-tidy (PlatformIO implementation)
# --------------------------------------------------
.clang-tidy-template:
  stage: format
  image: python:3.11

  variables:
    PLATFORMIO_CORE_DIR: "$CI_PROJECT_DIR/.pio"

  cache:
    key: platformio
    paths:
    - .pio/

  script:
  - |
    set -eu
    apt-get update
    apt-get install -y --no-install-recommends git
    pip install --no-cache-dir -U platformio
    platformio --version
    echo "Running PlatformIO check (clang-tidy) for env: ${PIO_ENV:-adafruit_feather_m0}"
    pio check --environment "${PIO_ENV:-adafruit_feather_m0}"

# --------------------------------------------------
# Concrete jobs exposed to consuming projects
# --------------------------------------------------
clang-format:
  extends: .clang-format-template

clang-tidy:
  extends: .clang-tidy-template
  rules:
  - exists:
    - platformio.ini
  - when: never
