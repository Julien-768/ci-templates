# mike.gitlab-ci.yml
#
# Shared GitLab CI component for deploying versioned MkDocs
# documentation with Mike to GitLab Pages.

spec:
  inputs:
    mk_path:
      type: string
      default: "."
      description: "Path to the directory containing the MkDocs project and requirements.txt."

    mkdocs_config_file:
      type: string
      default: "mkdocs.yml"
      description: "MkDocs configuration file, relative to mk_path."

    pages_stage:
      type: string
      default: "deploy"
      description: "CI stage used to publish the documentation."

    job_execution_mode:
      type: string
      default: "branch"
      options:
      - "branch"
      - "merge_request"
      - "both"
      description: "Where the job can run: on 'publication_branch' (branch), in merge request pipelines (merge_request), or both."

    publication_branch:
      type: string
      default: "develop"
      description: "Branch on which a matching commit message can trigger publication (modes 'branch' and 'both')."

    publication_keyword:
      type: string
      default: "publication"
      description: "Keyword that must appear in the commit message to trigger publication."

    exclusion_branch:
      type: string
      default: "exclusion-branch"
      description: "Branch on which job won't run."

    mike_branch:
      type: string
      default: "pages/mike"
      description: "Git branch used by Mike to store versioned documentation."

    gitlab_user_name:
      type: string
      default: "GitLab CI"
      description: "Git user name for commits."

    gitlab_user_email:
      type: string
      default: "gitlab-ci@example.com"
      description: "Git user email for commits."
---

.mike-template:
  image: python:3.14

  variables:
    MK_PATH: "$[[ inputs.mk_path ]]"
    MKDOCS_CONFIG_FILE: "$[[ inputs.mkdocs_config_file ]]"
    MIKE_BRANCH: "$[[ inputs.mike_branch ]]"
    GITLAB_USER_NAME: "$[[ inputs.gitlab_user_name ]]"
    GITLAB_USER_EMAIL: "$[[ inputs.gitlab_user_email ]]"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

  script:
  - |
    set -eu

    echo "Deploying versioned MkDocs documentation"
    echo "Project path: $MK_PATH"
    echo "MkDocs config: $MKDOCS_CONFIG_FILE"
    echo "Mike branch: $MIKE_BRANCH"

    cd "$CI_PROJECT_DIR/$MK_PATH"

    if [ ! -f "$MKDOCS_CONFIG_FILE" ]; then
      echo "ERROR: MkDocs configuration not found: $MKDOCS_CONFIG_FILE"
      exit 1
    fi

    if [ ! -f requirements.txt ]; then
      echo "ERROR: requirements.txt not found in $PWD"
      exit 1
    fi

    python -m pip install -r requirements.txt

    git config user.name "$GITLAB_USER_NAME"
    git config user.email "$GITLAB_USER_EMAIL"

    HTTPS_REMOTE="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"

    git fetch origin

    git checkout "$CI_COMMIT_SHA"

    if git ls-remote --exit-code --heads origin "$MIKE_BRANCH" >/dev/null 2>&1; then
        echo "Branch '$MIKE_BRANCH' already exists."
        git branch -f "$MIKE_BRANCH" "origin/$MIKE_BRANCH"
    else
        echo "Branch '$MIKE_BRANCH' does not exist. Creating it."
        git branch "$MIKE_BRANCH" "$CI_COMMIT_SHA"
    fi

    # Version: tag > merge request (mr-<iid>) > dev
    if [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
      IS_MR=true
      VERSION="${CI_COMMIT_TAG:-mr-$CI_MERGE_REQUEST_IID}"
    else
      IS_MR=false
      VERSION="${CI_COMMIT_TAG:-dev}"
    fi

    echo "Publishing version: $VERSION (merge request: $IS_MR)"

    # The 'latest' alias is never moved by a merge request pipeline.
    if [ "$IS_MR" = "true" ]; then
      mike deploy \
        --config-file "$MKDOCS_CONFIG_FILE" \
        --remote "$HTTPS_REMOTE" \
        --push \
        --branch "$MIKE_BRANCH" \
        "$VERSION"
    else
      mike deploy \
        --config-file "$MKDOCS_CONFIG_FILE" \
        --remote "$HTTPS_REMOTE" \
        --push \
        --branch "$MIKE_BRANCH" \
        --update-aliases latest \
        "$VERSION"

      mike set-default \
        --config-file "$MKDOCS_CONFIG_FILE" \
        --remote "$HTTPS_REMOTE" \
        --push \
        --branch "$MIKE_BRANCH" \
        latest
    fi

    # Export the published documentation for GitLab Pages.
    cd "$CI_PROJECT_DIR"

    git fetch origin "$MIKE_BRANCH"

    rm -rf public
    mkdir public

    git --work-tree=public checkout "origin/$MIKE_BRANCH" -- .

  artifacts:
    paths:
    - public
    expire_in: 24 hours

  pages: true

mike_pages:
  extends: .mike-template
  stage: $[[ inputs.pages_stage ]]
  variables:
    JOB_EXECUTION_MODE: "$[[ inputs.job_execution_mode ]]"
  rules:
  # Never publish from the excluded branch (push pipeline or MR pipeline)
  - if: '$CI_COMMIT_BRANCH == "$[[ inputs.exclusion_branch ]]" || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "$[[ inputs.exclusion_branch ]]"'
    when: never

  # Mode "branch" / "both": push pipeline on the configured branch
  - if: '($JOB_EXECUTION_MODE == "branch" || $JOB_EXECUTION_MODE == "both") && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH == "$[[ inputs.publication_branch ]]" && $CI_COMMIT_MESSAGE =~ /$[[ inputs.publication_keyword ]]/'

  # Mode "merge_request" / "both": merge request pipeline
  - if: '($JOB_EXECUTION_MODE == "merge_request" || $JOB_EXECUTION_MODE == "both") && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_MESSAGE =~ /$[[ inputs.publication_keyword ]]/'
