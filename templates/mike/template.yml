# mike.gitlab-ci.yml
#
# Template for deploying documentation with MkDocs and Mike to GitLab Pages.

spec:
  inputs:
    MK_PATH:
      description: "Path to the MkDocs project directory (default: current directory)."
      default: "."
    GITLAB_USER_NAME:
      description: "Git user name for commits."
      default: "GitLab CI"
    GITLAB_USER_EMAIL:
      description: "Git user email for commits."
      default: "gitlab-ci@example.com"
---
.mike-pages-template:
  stage: pages
  image: python:latest
  when: on_success
  dependencies: []
  needs: []

  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PAGES_BRANCH: gl-pages
    MK_PATH: "$[[ inputs.MK_PATH ]]"
    GITLAB_USER_NAME: "$[[ inputs.GITLAB_USER_NAME ]]"
    GITLAB_USER_EMAIL: "$[[ inputs.GITLAB_USER_EMAIL ]]"

  script:
  - export HTTPS_REMOTE="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  - cd "${MK_PATH}"
  - echo "Running on ${MK_PATH}"
  - pip install -r requirements.txt
  - git config user.name "$GITLAB_USER_NAME"
  - git config user.email "$GITLAB_USER_EMAIL"
  - git fetch origin "$PAGES_BRANCH" || true
  - git checkout "$CI_COMMIT_SHA"
  - git branch -f "$PAGES_BRANCH" "origin/$PAGES_BRANCH" || true
  - test -f mkdocs.yml || (echo "mkdocs.yml not found in $PWD" && exit 1)
  - mike deploy -r "$HTTPS_REMOTE" -p -b "$PAGES_BRANCH" -u "${CI_COMMIT_TAG:-dev}" latest
  - mike set-default -r "$HTTPS_REMOTE" -p -b "$PAGES_BRANCH" latest

  # Retrieve the content pushed to gl-pages and expose it as the Pages artifact.
  - cd "$CI_PROJECT_DIR"
  - git fetch origin "$PAGES_BRANCH"
  - rm -rf public
  - mkdir public
  - git --work-tree=public checkout "origin/$PAGES_BRANCH" -- .

  artifacts:
    paths:
    - public

  pages: true

mike_pages:
  extends: .mike-pages-template
  rules:
  - if: '$CI_COMMIT_MESSAGE =~ /publication/'
