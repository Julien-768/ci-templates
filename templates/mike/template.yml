# mike.gitlab-ci.yml

# This GitLab CI configuration file sets up jobs to build and deploy documentation using MkDocs and Mike.
# The mkdocs_test job builds the documentation and stores the output in the test directory.
# The pages job deploys the documentation to GitLab Pages.
# The PIP_CACHE_DIR variable is used to cache pip dependencies.
# The PAGES_BRANCH variable specifies the branch used for GitLab Pages.
# The HTTPS_REMOTE variable is used to authenticate with the GitLab repository.

# .gitlab-ci.yml

# Définir une ancre pour la configuration de mike_pages
.mike-pages-template:
  stage: pages
  image: python:latest
  when: on_success
  dependencies: []
  needs: []

  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PAGES_BRANCH: gl-pages
    HTTPS_REMOTE: https://gitlab-ci-token:${CI_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git

  script:
  - cd ${MK_PATH:-.}
  - pip install -r requirements.txt
  - git config user.name "$GITLAB_USER_NAME"
  - git config user.email "$GITLAB_USER_EMAIL"
  - test -f mkdocs.yml || exit 1
  - mike deploy --deploy-prefix public -r "$HTTPS_REMOTE" -p -b "$PAGES_BRANCH" -u "${CI_COMMIT_TAG:-dev}" latest
  - mike set-default --deploy-prefix public -r "$HTTPS_REMOTE" -p -b "$PAGES_BRANCH" latest
  - cp -r public "$CI_PROJECT_DIR/public"
  - find "$CI_PROJECT_DIR/public" -maxdepth 2 -type f | head -20

  artifacts:
    paths:
    - public

# Utiliser l'ancre dans le job mike_pages
mike_pages:
  extends: .mike-pages-template
  # Vous pouvez ajouter ou surcharger des paramètres spécifiques ici si nécessaire
  # rules:
  # - if: "$CI_COMMIT_MESSAGE =~ /publication/"
