# mike.gitlab-ci.yml

# This GitLab CI configuration file sets up jobs to build and deploy documentation using MkDocs and Mike.
# The mkdocs_test job builds the documentation and stores the output in the test directory.
# The pages job deploys the documentation to GitLab Pages.
# The PIP_CACHE_DIR variable is used to cache pip dependencies.
# The PAGES_BRANCH variable specifies the branch used for GitLab Pages.
# The HTTPS_REMOTE variable is used to authenticate with the GitLab repository.

# .gitlab-ci.yml

.mike-pages-template:
  stage: pages
  image: python:latest
  when: on_success
  dependencies: []
  needs: []

  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PAGES_BRANCH: gl-pages
    HTTPS_REMOTE: https://gitlab-ci-token:${CI_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git

  script:
  - cd ${MK_PATH:-.}
  - time pip install -r requirements.txt

  - time git config user.name "$GITLAB_USER_NAME"
  - time git config user.email "$GITLAB_USER_EMAIL"

  - git fetch origin $PAGES_BRANCH || true
  - git checkout $CI_COMMIT_SHA
  - git branch -f $PAGES_BRANCH origin/$PAGES_BRANCH || true

  - echo "$HTTPS_REMOTE"
  - pwd
  - ls -la
  - find . -maxdepth 2 -type d

  - test -f mkdocs.yml || (echo "mkdocs.yml is not found in $PWD" && exit 1)

  - time mike deploy -r "$HTTPS_REMOTE" -p -b "$PAGES_BRANCH" -u "${CI_COMMIT_TAG:-dev}" latest

  - time mike set-default -r "$HTTPS_REMOTE" -p -b "$PAGES_BRANCH" latest

mike_pages:
  extends: .mike-pages-template
