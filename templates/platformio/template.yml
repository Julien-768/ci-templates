# platformio template
#
# Shared GitLab CI component for building PlatformIO firmware.
# Inputs:
# - stage: CI stage used by the build job. Default: build
# - project_conf: PlatformIO config file path. Default: platformio.ini
# - project_dir: PlatformIO project directory. Default: .
# - environments: Optional PlatformIO environments to build. Default: ""

spec:
  inputs:
    stage:
      description: "CI stage used for the PlatformIO build job."
      default: build

    project_conf:
      description: "Path to the PlatformIO configuration file."
      default: platformio.ini

    project_dir:
      description: "Root directory of the PlatformIO project."
      default: .

    environments:
      description: "Optional list of PlatformIO environments to build."
      default: ""
---

.platformio-build-template:
  stage: $[[ inputs.stage ]]
  image: python:3.11

  script:
  - apt-get update
  - apt-get install -y --no-install-recommends nodejs
  - pip install --no-cache-dir -U platformio

  - |
    PIO_ARGS="--project-dir $[[ inputs.project_dir ]] --project-conf $[[ inputs.project_conf ]]"

    if [ -n "$[[ inputs.environments ]]" ]; then
      for env in $[[ inputs.environments ]]; do
        echo "Building PlatformIO environment: ${env}"
        pio run ${PIO_ARGS} --environment "${env}"
      done
    else
      echo "Building PlatformIO default environment(s)"
      pio run ${PIO_ARGS}
    fi

pio-build:
  extends: .platformio-build-template

  rules:
  - exists:
    - $[[ inputs.project_conf ]]
  - when: never
