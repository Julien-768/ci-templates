---
# ============================================================
# Windows installer template for Python GUI projects
#
# Shared GitLab CI component for building Windows installers
# using PyInstaller and Inno Setup.
# ============================================================

spec:
  inputs:

    stage:
      description: "CI stage used for the installer job."
      default: build

    image:
      description: "Docker image used for building the installer."
      default: python:3.13-slim

    project_dir:
      description: "Root directory of the project."
      default: "."

    template_dir:
      description: "Directory containing template files."
      default: "templates/python-windows-installer"

    app_name:
      description: "Application name displayed in installer."
      default: DummyApp

    exe_name:
      description: "Executable name generated by PyInstaller."
      default: MainApp

    app_version:
      description: "Application version."
      default: "0.1.0"

    app_id:
      description: "Windows application identifier."
      default: DUMMY-APP-TEST-0001

    main_script:
      description: "Python entry point relative to project directory."
      default: "src/main.py"

    project_root:
      description: "Project root passed to PyInstaller."
      default: "."

    pyinstaller_template:
      description: "PyInstaller template file."
      default: "dummy_app.spec.in"

    pyinstaller_spec:
      description: "Generated PyInstaller spec file."
      default: "dummy_app.spec"

    inno_template:
      description: "Inno Setup template file."
      default: "installer.iss.in"

    inno_script:
      description: "Generated Inno Setup script."
      default: "installer.iss"

    output_dir:
      description: "Installer output directory."
      default: "release"

---

.windows-installer-template:
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]

  tags:
    - ccin2p3
    - x64

  before_script:
    - dpkg --add-architecture i386
    - apt-get update
    - apt-get install -y wine wine32:i386 wget file xvfb
    - wine --version
    - wineboot --init

    # Install Inno Setup
    - wget -O /tmp/innosetup.exe "https://jrsoftware.org/download.php/is.exe"
    - xvfb-run -a wine /tmp/innosetup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART

    # Install Python
    - wget -O /tmp/python-installer.exe "https://www.python.org/ftp/python/3.13.14/python-3.13.14.exe"
    - xvfb-run -a wine /tmp/python-installer.exe /quiet InstallAllUsers=0 PrependPath=1 Include_test=0 /log C:\\python-install.log || true
    - export WINE_PYTHON=$(find ~/.wine/drive_c -name "python.exe" | head -n 1)
    - test -f "$WINE_PYTHON" || { echo "Python not found in Wine"; exit 1; }

    # Install pip and PyInstaller
    - xvfb-run -a wine "$WINE_PYTHON" -m pip install --upgrade pip
    - xvfb-run -a wine "$WINE_PYTHON" -m pip install pyinstaller

  script:
    - cd $[[ inputs.project_dir ]]

    # Generate PyInstaller spec
    - sed -e "s|@MAIN_SCRIPT@|$[[ inputs.main_script ]]|g" -e "s|@PROJECT_ROOT@|$[[ inputs.project_root ]]|g" -e "s|@EXE_NAME@|$[[ inputs.exe_name ]]|g" "$CI_PROJECT_DIR/$[[ inputs.template_dir ]]/$[[ inputs.pyinstaller_template ]]" > "$[[ inputs.pyinstaller_spec ]]"

    # Generate Inno Setup script
    - sed -e "s|@APP_NAME@|$[[ inputs.app_name ]]|g" -e "s|@EXE_NAME@|$[[ inputs.exe_name ]]|g" -e "s|@APP_VERSION@|$[[ inputs.app_version ]]|g" -e "s|@APP_ID@|$[[ inputs.app_id ]]|g" -e "s|@OUTPUT_DIR@|$[[ inputs.output_dir ]]|g" "$CI_PROJECT_DIR/$[[ inputs.template_dir ]]/$[[ inputs.inno_template ]]" > "$[[ inputs.inno_script ]]"

    # Install project dependencies
    - xvfb-run -a wine "$WINE_PYTHON" -m pip install -e .

    # Build executable
    - xvfb-run -a wine "$WINE_PYTHON" -m PyInstaller "$[[ inputs.pyinstaller_spec ]]"

    # Build installer
    - mkdir -p "$CI_PROJECT_DIR/$[[ inputs.output_dir ]]"
    - export INNO_SCRIPT_WIN=$(winepath -w "$CI_PROJECT_DIR/$[[ inputs.inno_script ]]")
    - xvfb-run -a wine "$HOME/.wine/drive_c/Program Files/Inno Setup 6/ISCC.exe" "$INNO_SCRIPT_WIN"

  artifacts:
    paths:
      - "$CI_PROJECT_DIR/$[[ inputs.output_dir ]]/*.exe"

windows-installer:
  extends: .windows-installer-template
