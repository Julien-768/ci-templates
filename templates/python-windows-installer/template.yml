# ============================================================
# Windows installer template for Python GUI projects
#
# Shared GitLab CI component for building Windows installers
# using PyInstaller and Inno Setup.
# ============================================================

spec:
  inputs:
    project_dir:
      type: string
      default: "."
      description: "Root directory of the project."
    template_dir:
      type: string
      default: "templates/python-windows-installer"
      description: "Directory containing template files."
    app_name:
      type: string
      default: "DummyApp"
      description: "Application name displayed in installer."
    exe_name:
      type: string
      default: "MainApp"
      description: "Executable name generated by PyInstaller."
    app_version:
      type: string
      default: "0.1.0"
      description: "Application version."
    app_id:
      type: string
      default: "DUMMY-APP-TEST-0001"
      description: "Windows application identifier."
    main_script:
      type: string
      default: "src/main.py"
      description: "Python entry point relative to project directory."
    project_root:
      type: string
      default: "."
      description: "Project root passed to PyInstaller."
    pyinstaller_template:
      type: string
      default: "dummy_app.spec.in"
      description: "PyInstaller template file."
    pyinstaller_spec:
      type: string
      default: "dummy_app.spec"
      description: "Generated PyInstaller spec file."
    inno_template:
      type: string
      default: "installer.iss.in"
      description: "Inno Setup template file."
    inno_script:
      type: string
      default: "installer.iss"
      description: "Generated Inno Setup script."
    output_dir:
      type: string
      default: "release"
      description: "Installer output directory."
    stage:
      type: string
      default: "build"
      description: "CI stage used for Windows build jobs."

---

# ============================================================
# Build Windows executable with PyInstaller via Wine
# ============================================================
python-pyinstaller:
  stage: $[[ inputs.stage ]]
  image: python:3.13-slim
  tags:
    - ccin2p3
    - x64
  script:
    - "dpkg --add-architecture i386"
    - "apt-get update"
    - "apt-get install -y wine wine32:i386 wget curl file xvfb ca-certificates"
    - "Xvfb :99 -screen 0 1024x768x16 &"
    - "export DISPLAY=:99"
    - "sleep 2"
    - "wineboot --init"
    - "wineserver -w"
    # Install Windows Python 3.13 to a fixed directory
    - "curl -fSL -o /tmp/python-installer.exe https://www.python.org/ftp/python/3.13.1/python-3.13.1.exe"
    - "wine /tmp/python-installer.exe /quiet InstallAllUsers=1 TargetDir=C:\\Python313 PrependPath=1 Include_test=0 || true"
    - "wineserver -w"
    # Use the fixed path directly
    - "export WINE_PYTHON=\"C:\\Python313\\python.exe\""
    - "test -f \"$HOME/.wine/drive_c/Python313/python.exe\" || { echo 'Python not found in Wine'; exit 1; }"
    - "echo \"Using Windows Python: $WINE_PYTHON\""
    - "wine \"$WINE_PYTHON\" --version"
    - "wine \"$WINE_PYTHON\" -m pip --version"
    # Upgrade pip and install PyInstaller
    - "wine \"$WINE_PYTHON\" -m pip install --upgrade pip"
    - "wine \"$WINE_PYTHON\" -m pip install pyinstaller"

    - "cd \"$[[ inputs.project_dir ]]\""
    # Generate PyInstaller spec
    - "sed -e \"s|@MAIN_SCRIPT@|$[[ inputs.main_script ]]|g\" -e \"s|@PROJECT_ROOT@|$[[ inputs.project_root ]]|g\" -e \"s|@EXE_NAME@|$[[ inputs.exe_name ]]|g\" \"$CI_PROJECT_DIR/$[[ inputs.template_dir ]]/$[[ inputs.pyinstaller_template ]]\" > \"$[[ inputs.pyinstaller_spec ]]\""
    # Install project (pyproject.toml project)
    - "wine \"$WINE_PYTHON\" -m pip install ."
    # Debug installed packages
    - "wine \"$WINE_PYTHON\" -m pip list"
    # Build executable
    - "wine \"$WINE_PYTHON\" -m PyInstaller \"$[[ inputs.pyinstaller_spec ]]\""
    # Debug output
    - "ls -R dist || true"
  artifacts:
    paths:
      - "$[[ inputs.project_dir ]]/dist/"
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'

# ============================================================
# Build installer with Inno Setup
# ============================================================
python-inno-setup:
  stage: $[[ inputs.stage ]]
  image:
    name: amake/innosetup:latest
    entrypoint: [""]
  tags:
    - ccin2p3
    - x64
  needs:
    - python-pyinstaller
  script:
    - "cd \"$[[ inputs.project_dir ]]\""
    # Generate Inno Setup script
    - "sed -e \"s|@APP_NAME@|$[[ inputs.app_name ]]|g\" -e \"s|@EXE_NAME@|$[[ inputs.exe_name ]]|g\" -e \"s|@APP_VERSION@|$[[ inputs.app_version ]]|g\" -e \"s|@APP_ID@|$[[ inputs.app_id ]]|g\" -e \"s|@OUTPUT_DIR@|$[[ inputs.output_dir ]]|g\" \"$CI_PROJECT_DIR/$[[ inputs.template_dir ]]/$[[ inputs.inno_template ]]\" > \"$[[ inputs.inno_script ]]\""
    - "mkdir -p \"$CI_PROJECT_DIR/$[[ inputs.output_dir ]]\""
    # Build installer
    - "iscc \"$CI_PROJECT_DIR/$[[ inputs.inno_script ]]\""
  artifacts:
    paths:
      - "$[[ inputs.output_dir ]]/*.exe"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'
