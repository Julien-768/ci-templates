default_language_version:
  python: python3.13

repos:

# Versioning: Commit Messages
- repo: https://github.com/commitizen-tools/commitizen.git
  rev: v4.4.1
  hooks:
  - id: commitizen
    stages: [ commit-msg ]

# Lint: All files
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: end-of-file-fixer
  - id: trailing-whitespace
  - id: check-json
  - id: check-toml
  - id: check-yaml
    args: [ --allow-multiple-documents ]
  - id: requirements-txt-fixer

# Lint: html, css
- repo: https://github.com/Lucas-C/pre-commit-hooks-lxml
  rev: v1.1.0
  hooks:
  - id: forbid-html-img-without-alt-text
  - id: detect-missing-css-classes
    args: [ --css-files-dir, \docs\, --html-files-dir, \docs\ ]
  - id: html-tags-blacklist
  - id: html-attributes-blacklist

# Lint: Markdown
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.44.0
  hooks:
  - id: markdownlint

# Autoformat: Python
- repo: https://github.com/psf/black-pre-commit-mirror
  rev: 25.1.0
  hooks:
  - id: black
    language_version: python3.13

- repo: https://github.com/PyCQA/isort
  rev: 9.0.2
  hooks:
  - id: isort
    args: [ "--profile=black", "--line-length=120" ]

- repo: https://github.com/PyCQA/flake8
  rev: 6.1.0
  hooks:
  - id: flake8
    args: [ "--max-line-length=120", "--ignore=E203,W503" ]

- repo: https://github.com/pycqa/pylint
  rev: v3.0.3
  hooks:
  - id: pylint
    args: [ "--rcfile=pyproject.toml" ]

# Autoformat: Prettier
- repo: https://github.com/rbubley/mirrors-prettier
  rev: v3.5.3 # check https://github.com/rbubley/mirrors-prettier/tags for latest
  hooks:
  - id: prettier
    types_or: [ javascript, css, scss, html, json, yaml, markdown ]
    args: [ --write ]

# Autoformat: C
- repo: https://github.com/pocc/pre-commit-hooks
  rev: v1.3.5
  hooks:
  - id: clang-format
    args: [ "--style=file:.clang-format.yml", "-i" ]
    files: ^src/.*\.(c|h)$
